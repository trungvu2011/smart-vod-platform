services:
  # 1. Cơ sở dữ liệu PostgreSQL
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: rootpassword
      POSTGRES_DB: vod_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  # 2. Hệ thống lưu trữ MinIO
  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: adminpassword
    ports:
      - "9000:9000" # Port cho API (Code gọi vào đây)
      - "9001:9001" # Port cho Giao diện Web (Em dùng trình duyệt vào xem file)
    volumes:
      - miniodata:/data

  # 3. Message Queue RabbitMQ
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: admin
      RABBITMQ_DEFAULT_PASS: adminpassword
    ports:
      - "5672:5672" # Port cho API đẩy message
      - "15672:15672" # Port cho Giao diện Web (Quản lý queue)

  # 4. Cache Redis
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    volumes:
      - redisdata:/data

  # 5. LiveKit SFU Server (WebRTC)
  livekit:
    image: livekit/livekit-server:latest
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"   # HTTP/WebSocket port
      - "7881:7881/tcp"   # RTC TCP fallback port
      - "7882:7882/udp"   # RTC UDP mux port
      - "3478:3478/tcp"   # TURN/TCP relay port
      - "3478:3478/udp"   # TURN/UDP relay port
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml
    depends_on:
      redis:
        condition: service_healthy
        restart: true
    restart: unless-stopped

  # 6. LiveKit Egress (Recording service)
  livekit-egress:
    image: livekit/egress:latest
    environment:
      EGRESS_CONFIG_FILE: /etc/egress.yaml
    volumes:
      - ./egress.yaml:/etc/egress.yaml
    depends_on:
      - livekit
      - minio
    cap_add:
      - SYS_ADMIN  # Required for Chrome sandbox in Egress

volumes:
  pgdata:
  miniodata:
  redisdata:
