# LiveKit Server Configuration (Development)
port: 7880
redis:
  address: redis:6379
rtc:
  tcp_port: 7881
  udp_port: 7882
  use_external_ip: false
  enable_loopback_candidate: true
  allow_tcp_fallback: true
turn:
  enabled: true
  udp_port: 3478
keys:
  devkey: supersecretlivekitkeythatisverylong32chars
webhook:
  api_key: devkey
  urls:
    - "http://host.docker.internal:5000/api/meetings/webhook/livekit"
logging:
  level: warn
